<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img">
<title>What happens when you vote</title>
<rect width="100%" height="100%" rx="12" fill="#f5f4ee"/>
<g font-family="system-ui, sans-serif">
<text x="36" y="39" font-size="22" font-weight="700" fill="#202721">What happens when you vote</text>
<circle cx="47" cy="82" r="12" fill="#28594b"/>
<text x="47" y="86" text-anchor="middle" font-size="11" fill="white">1</text>
<text x="76" y="87" font-size="18" font-weight="650" fill="#202721">Player → REST</text>
<text x="76" y="113" font-size="15" fill="#3e4d44">React sends the selected card with the session token.</text>
<path d="M47 117V154" stroke="#879486" stroke-width="2"/>
<circle cx="47" cy="166" r="12" fill="#28594b"/>
<text x="47" y="170" text-anchor="middle" font-size="11" fill="white">2</text>
<text x="76" y="171" font-size="18" font-weight="650" fill="#202721">TurnService → PostgreSQL</text>
<text x="76" y="197" font-size="15" fill="#3e4d44">The service locks the game and validates the vote. The last vote also closes the round.</text>
<path d="M47 201V238" stroke="#879486" stroke-width="2"/>
<circle cx="47" cy="250" r="12" fill="#28594b"/>
<text x="47" y="254" text-anchor="middle" font-size="11" fill="white">3</text>
<text x="76" y="255" font-size="18" font-weight="650" fill="#202721">Spring Boot → STOMP subscribers</text>
<text x="76" y="281" font-size="15" fill="#3e4d44">After commit, the broker sends a short notice that the state changed.</text>
<path d="M47 285V322" stroke="#879486" stroke-width="2"/>
<circle cx="47" cy="334" r="12" fill="#28594b"/>
<text x="47" y="338" text-anchor="middle" font-size="11" fill="white">4</text>
<text x="76" y="339" font-size="18" font-weight="650" fill="#202721">Subscribed browsers → REST</text>
<text x="76" y="365" font-size="15" fill="#3e4d44">Each browser asks for the updated game view. The server applies that player’s permissions.</text>
</g></svg>
