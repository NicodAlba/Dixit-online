# No secrets/default production credentials are embedded here.
spring.datasource.url=${DIXIT_DB_URL:}
spring.datasource.username=${DIXIT_DB_USERNAME:}
spring.datasource.password=${DIXIT_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.sslmode=${DIXIT_DB_SSL_MODE:verify-full}
spring.datasource.hikari.data-source-properties.currentSchema=dixit
spring.flyway.enabled=true
spring.flyway.url=${DIXIT_DB_URL:}
spring.flyway.user=${DIXIT_MIGRATION_DB_USERNAME:}
spring.flyway.password=${DIXIT_MIGRATION_DB_PASSWORD:}
spring.flyway.schemas=dixit
spring.flyway.default-schema=dixit
spring.flyway.jdbc-properties.sslmode=${DIXIT_DB_SSL_MODE:verify-full}
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=dixit
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${DIXIT_TRUSTED_PROXY_REGEX:127[.]0[.]0[.]1|::1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

dixit.database.runtime-role=${DIXIT_DB_ROLE:${DIXIT_DB_USERNAME:}}
spring.flyway.placeholders.runtimeRole=${dixit.database.runtime-role}

dixit.web.allowed-origins=${DIXIT_ALLOWED_ORIGINS:}

dixit.errors.include-internal-details=false
